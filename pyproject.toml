[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jdiff-cli"
version = "0.1.0"
description = "A readable diff for JSON files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["json", "diff", "compare", "cli", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/jdiff"
Issues = "https://github.com/Viltrumlik/jdiff/issues"

[project.scripts]
jdiff = "jdiff:main"

[tool.setuptools]
py-modules = ["jdiff"]
